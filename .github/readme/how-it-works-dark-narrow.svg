<svg xmlns="http://www.w3.org/2000/svg" width="520" height="651" viewBox="0 0 520 651" role="img" aria-label="Press the shortcut: The screen is captured, shown frozen, and the selection happens on top of that image. Drag over the area: Over a frozen screenshot, with a 6× magnifier that shows the exact colour in hex, copied with C and snapping to system windows: one click takes the whole window. Let go: A toolbar appears over the selection: copy, save, edit Export: GIF, MP4, PNG or JPG, to disk and to the clipboard: an image pastes as an image, and a GIF or MP4 pastes as a file into Slack, Discord or Explorer."><g transform="translate(8 8) scale(2)"><g fill="none" stroke="#0A9BFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9"><path d="M10 8h.01M12 12h.01M14 8h.01M16 12h.01M18 8h.01M6 8h.01M7 16h10m-9-4h.01"/><rect width="20" height="16" x="2" y="4" rx="2"/></g></g><text x="80" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#f0f6fc">Press the shortcut</text><text x="80" y="68" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" fill="#9198a1">The screen is captured, shown</text><text x="80" y="97" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" fill="#9198a1">frozen, and the selection happens on</text><text x="80" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" fill="#9198a1">top of that image.</text><path d="M32 68 V169" stroke="#3d444d" stroke-width="2" fill="none"/><path d="M26 161 L32 169 L38 161" stroke="#3d444d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(8 181) scale(2)"><g fill="none" stroke="#0A9BFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9"><path d="M6 2v14a2 2 0 0 0 2 2h1