rial,sans-serif" font-size="17" fill="#9198a1">edit</text><path d="M646 34 H792" stroke="#3d444d" stroke-width="2" fill="none"/><path d="M785 28 L794 34 L785 40" stroke="#3d444d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(814 8) scale(2.1667)"><g fill="none" stroke="#0A9BFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.59 13.51l6.83 3.98m-.01-10.98l-6.82 3.98"/></g></g><text x="840" y="100" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#f0f6fc">Export</text><text x="840" y="134" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#9198a1">GIF, MP4, PNG or JPG, to</text><text x="840" y="159" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#9198a1">disk and to the clipboard.</text></svg>