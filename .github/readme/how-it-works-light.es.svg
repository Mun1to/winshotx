<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" role="img" aria-label="Pulsa el atajo: Se captura la pantalla, se muestra congelada y se selecciona encima. Arrastra sobre la zona: Sobre la pantalla congelada, con lupa 6× que da el color exacto en hexadecimal y ajuste a las ventanas: un clic coge la ventana entera. Suelta: Aparece una barra sobre la selección: copiar, guardar, editar Exporta: GIF, MP4, PNG o JPG, a disco y al portapapeles: la imagen se pega como imagen y el GIF o el MP4 se pegan como archivo en Slack, Discord o el Explorador."><g transform="translate(94 8) scale(2.1667)"><g fill="none" stroke="#0A9BFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9"><path d="M10 8h.01M12 12h.01M14 8h.01M16 12h.01M18 8h.01M6 8h.01M7 16h10m-9-4h.01"/><rect width="20" height="16" x="2" y="4" rx="2"/></g></g><text x="120" y="100" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#1f2328">Pulsa el atajo</text><text x="120" y="134" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#59636e">Se captura la pantalla, se</text><text x="120" y="159" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#59636e">muestra congelada y se</text><text x="120" y="184" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#59636e">selecciona encima.</text><path d="M166 34 H312" stroke="#d1d9e0" stroke-width="2" fill="none"/><path d="M305 28 L314 34 L305 40" stroke="#d1d9e0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(334 8) scale(2.1667)"><g fill="none" stroke="#0A9BFF" stroke-linecap="round" stroke-linejoin="round"