name: Publicar la web

# La web vive en Cloudflare Pages, no en GitHub Pages. Este workflow comprueba primero y
# publica despues: si el ingles o las huellas de los archivos estan desfasados, Cloudflare
# desplegaria una version torcida sin quejarse de nada, asi que la comprobacion es la que
# frena el despliegue.
on:
  push:
    branches: [main]
    paths:
      - "frontlaxweb/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "frontlaxweb/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: El ingles y las huellas estan al dia
        run: |
          node frontlaxweb/generar-en.mjs
          # --porcelain y no `git diff`: diff no ve una pagina nueva que nadie anadio
          # al indice, y el generador tambien reescribe las preguntas del espanol.
          sucio=$(git status --porcelain frontlaxweb)
          if [ -n "$sucio" ]; then
            echo "$sucio"
            echo "::error::frontlaxweb no esta al dia; corre node frontlaxweb/generar-en.mjs y commitea"
            exit 1
          fi
      - name: Ninguna pagina se queda sin traducir
        run: |
          for f in frontlaxweb/en/index.html frontlaxweb/en/docs/index.html; do
            if grep -q 'data-en=\|data-aria-en=\|data-titulo-en=' "$f"; then
              echo "::error::$f tiene textos sin traducir"
              grep -o 'data-\(en\|aria-en\|titulo-en\)="[^"]*"' "$f" | head -5
              exit 1
            fi
          done
      - name: El sitemap y las paginas dicen lo mismo
        run: |
          node -e '
            const {readFileSync, existsSync} = require("node:fs");
            const urls = [...readFileSync("frontlaxweb/sitemap.xml", "utf8")
              .matchAll(/<loc>https:\/\/winshotx\.com\/([^<]*)<\/loc>/g)].map(([, r]) => r);
            let mal = 0;
            for (const ruta of urls) {
              const archivo = "frontlaxweb/" + ruta + "index.html";
              if (!existsSync(archivo)) {
                console.error(`::error::el sitemap lista /${ruta} y no existe ${archivo}`);
                mal++;
              }
            }
            console.log(`${urls.length} URLs en el sitemap, ${mal} sin pagina`);
            process.exit(mal ? 1 : 0);
          '

  publicar:
    needs: comprobar
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: https://winshotx.com/
    steps:
      - uses: actions/checkout@v4
      # Direct Upload en vez de conectar el repo a Cloudflare: asi no hay que instalar
      # ninguna aplicacion de terceros en la cuenta de GitHub, y el despliegue se ve y se
      # audita aqui, en el mismo sitio que el codigo.
      - name: Subir a Cloudflare Pages
        run: |
          # Sin el secreto puesto, avisar y seguir: mejor que dejar el CI en rojo por algo
          # que solo puede arreglar quien tiene acceso a los ajustes del repositorio.
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::falta el secreto CLOUDFLARE_API_TOKEN, no se ha desplegado"
            exit 0
          fi
          npx --yes wrangler@4 pages deploy frontlaxweb --project-name=winshotx --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Avisar a los buscadores
        run: node frontlaxweb/avisar-buscadores.mjs
        continue-on-error: true
