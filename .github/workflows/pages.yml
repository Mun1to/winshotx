name: Publicar la web

# La landing vive en frontlaxweb/ y se publica en GitHub Pages tal cual, sin compilar nada.
on:
  push:
    branches: [main]
    paths:
      - "frontlaxweb/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Comprobar que el ingles esta al dia
        run: |
          node frontlaxweb/generar-en.mjs
          # --porcelain y no `git diff`: diff no ve una pagina nueva que nadie anadio
          # al indice, y el generador tambien reescribe las preguntas del espanol.
          sucio=$(git status --porcelain frontlaxweb)
          if [ -n "$sucio" ]; then
            echo "$sucio"
            echo "::error::frontlaxweb no esta al dia; corre node frontlaxweb/generar-en.mjs y commitea"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontlaxweb
      - id: despliegue
        uses: actions/deploy-pages@v4
