[package]
name = "winshotx"
version = "0.6.0"
description = "Captura de pantalla y grabación GIF/MP4 local, ligera y open source"
authors = ["munir"]
license = "MIT"
edition = "2021"
rust-version = "1.82"

[lib]
name = "winshotx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tempfile = "3.27"
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Una sola instancia: dos winshotx a la vez se pelean por los atajos globales
# y el segundo se queda sin ellos sin decir por que.
tauri-plugin-single-instance = "2"
# Actualizacion desde la propia app, firmada: sin esto habria que ir a GitHub a mano.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
rayon = "1"
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg"] }
gif = "0.13"
color_quant = "1.1"
qoi = "0.4"
xcap = "0.9"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
# Lo que añada cada sesión del plan de CleanShot X y Screen Studio, debajo de su marca.
# S1 (línea de tiempo)
# S2 (grabación)
# S3 (fondos)
# S4 (capturas)
# Leer los códigos QR de una captura (E5). Rust puro, MIT, y +33 KB en el .exe (rqrr eran +178).
quircs = "0.10"
# S5 (scroll)

[target.'cfg(windows)'.dependencies]
windows-capture = "2"
clipboard-win = "5"
# El `.join()` que espera a un `IAsyncOperation` de WinRT vive en un trait de este crate,
# no en el de `windows`: sin el, `StartupTask::GetAsync` no se puede resolver.
windows-future = "0.3"

# Va en su propia tabla para que cada sesión del plan añada sus características debajo de su
# marca sin pisar la línea de otra.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_Graphics_Dwm", "Win32_Globalization", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_Storage_Xps", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Globalization", "Foundation_Collections", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Graphics_Capture", "Graphics_DirectX_Direct3D11", "Win32_Graphics_Direct3D11", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_Storage_Packaging_Appx", "ApplicationModel",
  # S1 (línea de tiempo)
  # S2 (grabación)
  # La webcam: se graba aparte con Media Foundation (`record/camara.rs`).
  "Win32_Media_MediaFoundation",
  # S3 (fondos)
  "Win32_Media_MediaFoundation",
  # S4 (capturas)
  # Arrastrar la miniatura a otra app (OLE) y las miniaturas del historial (el shell).
  "Win32_UI_Shell", "Win32_System_Ole", "Win32_System_Memory",
  # S5 (scroll)
  # S15 (agente): la tubería con nombre del canal de agentes, solo para este usuario, y la
  # consola de la orden `agent` (el exe de release es de subsistema Windows).
  "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization",
  "Win32_System_IO", "Win32_System_Console", "Win32_System_WindowsProgramming", "Win32_System_JobObjects",
  # S22 (abrir a mano): saber si la copia de la Store la ha arrancado su tarea de inicio.
  "ApplicationModel_Activation",
  "System", "Win32_System_WinRT",
]

# Linux (S21, Fase 1 del plan de Linux). Todo esto ya va dentro de Tauri o es Rust puro:
# - gtk: el portapapeles con varios formatos a la vez, y la pantalla completa en un monitor
#   concreto. Es la misma version que trae Tauri, asi que no compila nada nuevo.
# - ashpd: los portales de xdg-desktop-portal (la foto de Wayland, los atajos globales, la
#   carpeta con el archivo marcado). La 0.12 es la ultima que cabe en nuestro rust-version.
# - fontdb + ab_glyph: las letras sin GDI (el numero de los pasos, el texto al exportar, la
#   pastilla de las teclas), con las fuentes que ya tiene el sistema.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
ashpd = { version = "0.12", default-features = false, features = ["tokio"] }
# Para escuchar los atajos del portal a la vez que llegan cambios de los ajustes. Son las
# mismas que ya trae ashpd: no compilan nada nuevo.
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }
fontdb = "0.24"
ab_glyph = "0.2"
# Grabar (Fase 2 del plan de Linux). Nada de esto compila algo nuevo: x11rb ya viene con el
# plugin de los atajos, pipewire con xcap, y libc con casi todo.
# - x11rb: los fotogramas de X11 por memoria compartida (MIT-SHM) y el raton por XFixes.
#   Y el marco de grabar: Shape recorta sus ventanas y deja pasar el raton (ya venia con XFixes).
#   Y la captura con scroll: XTEST gira la rueda como la giraria quien captura. Es otro
#   modulo del mismo x11rb: no compila ningun paquete nuevo.
# - libc: reservar esa memoria compartida (shmget y shmat).
x11rb = { version = "0.13", features = ["shm", "xfixes", "shape", "xtest"] }
libc = "0.2"
# - pipewire: los fotogramas de Wayland (el nodo que da el portal ScreenCast) y el sonido.
#   Es la misma version que ya trae xcap.
pipewire = "0.10"
# El MP4 (Fase 3 del plan de Linux): se escribe y se lee con el GStreamer del sistema, que ya
# esta en cualquier equipo con WebKitGTK. Asi no se reparte ningun codificador H.264.
# - La linea 0.21 es la de glib 0.18, la misma que el gtk de Tauri: no entra un segundo glib.
# - Sin las features v1_22 ni v1_24: Ubuntu 22.04 trae GStreamer 1.20.
gstreamer = "0.21"
gstreamer-app = "0.21"

# El binario tiene que caber en unos pocos MB: nada de simbolos ni unidades sueltas.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false

# Solo Linux, y solo los binarios de depuracion y `cargo test`: `libspa` (lo trae `pipewire`)
# sin sus comprobaciones de depuracion. El PipeWire 0.3.48 de Ubuntu 22.04 manda un «hecho» sin
# la marca de asincrono mientras se listan los aparatos de sonido, y el `debug_assert!` de
# `AsyncSeq::from_raw` salta dentro de una funcion a la que llama C, de donde un panico no puede
# salir: el proceso aborta al arrancar. En release esa comprobacion no existe, asi que esto deja
# `cargo test` y los binarios de depuracion igual que el que se reparte.
[profile.dev.package.libspa]
debug-assertions = false
