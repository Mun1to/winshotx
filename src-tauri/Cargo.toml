[package]
name = "winshotx"
version = "0.4.0"
description = "Captura de pantalla y grabación GIF/MP4 local, ligera y open source"
authors = ["munir"]
license = "MIT"
edition = "2021"
rust-version = "1.82"

[lib]
name = "winshotx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Una sola instancia: dos winshotx a la vez se pelean por los atajos globales
# y el segundo se queda sin ellos sin decir por que.
tauri-plugin-single-instance = "2"
# Actualizacion desde la propia app, firmada: sin esto habria que ir a GitHub a mano.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
rayon = "1"
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg"] }
gif = "0.13"
color_quant = "1.1"
qoi = "0.4"
xcap = "0.9"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
# Lo que añada cada sesión del plan de CleanShot X y Screen Studio, debajo de su marca.
# S1 (línea de tiempo)
# S2 (grabación)
# S3 (fondos)
# S4 (capturas)
# Leer los códigos QR de una captura (E5). Rust puro, MIT, y +33 KB en el .exe (rqrr eran +178).
quircs = "0.10"
# S5 (scroll)

[target.'cfg(windows)'.dependencies]
windows-capture = "2"
clipboard-win = "5"
# El `.join()` que espera a un `IAsyncOperation` de WinRT vive en un trait de este crate,
# no en el de `windows`: sin el, `StartupTask::GetAsync` no se puede resolver.
windows-future = "0.3"

# Va en su propia tabla para que cada sesión del plan añada sus características debajo de su
# marca sin pisar la línea de otra.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_Graphics_Dwm", "Win32_Globalization", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Storage_Xps", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Globalization", "Foundation_Collections", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Graphics_Capture", "Graphics_DirectX_Direct3D11", "Win32_Graphics_Direct3D11", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_Storage_Packaging_Appx", "ApplicationModel",
  # S1 (línea de tiempo)
  # S2 (grabación)
  # La webcam: se graba aparte con Media Foundation (`record/camara.rs`).
  "Win32_Media_MediaFoundation",
  # S3 (fondos)
  "Win32_Media_MediaFoundation",
  # S4 (capturas)
  # Arrastrar la miniatura a otra app (OLE) y las miniaturas del historial (el shell).
  "Win32_UI_Shell", "Win32_System_Ole", "Win32_System_Memory",
  # S5 (scroll)
]

# El binario tiene que caber en unos pocos MB: nada de simbolos ni unidades sueltas.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false
